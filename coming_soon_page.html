<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Cloud Engineer</title>
    <!-- Fallback meta refresh just in case JavaScript is disabled -->
    <meta http-equiv="refresh" content="300;url=index.html">
    <style>
        :root {
            --text-main: #1d1d1f; 
            --text-muted: #515154;
            --accent: #0066cc; 
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px 120px 20px;
            display: flex;
            justify-content: center;
            align-items: center; /* Centers content vertically */
            min-height: 100vh;
            
            /* macOS-style pastel mesh gradient background */
            background-color: #f5f5f7;
            background-image: 
                radial-gradient(at 80% 0%, rgba(186, 230, 253, 1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, rgba(254, 205, 211, 1) 0px, transparent 50%),
                radial-gradient(at 80% 100%, rgba(221, 214, 254, 1) 0px, transparent 50%),
                radial-gradient(at 0% 0%, rgba(253, 230, 138, 1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* --- MAIN PORTFOLIO CONTAINER --- */
        .container {
            max-width: 600px;
            width: 100%;
            padding: 80px 50px;
            box-sizing: border-box;
            text-align: center;

            /* Liquid Glass Effect */
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px); 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05); 
            border-radius: 24px; 
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            letter-spacing: -0.05em;
            margin: 0 0 5px 0;
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 25px;
            display: block;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 30px;
        }

        .timer-text {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(0, 102, 204, 0.1);
            padding: 5px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 10px;
        }

        /* Glass Button */
        .glass-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 28px;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            
            /* Glassmorphism for Button */
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
        }

        .glass-btn:hover {
            transform: translateY(-3px) scale(1.05);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            color: var(--accent);
        }

        .glass-btn:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* --- APPLE-STYLE MAC DOCK --- */
        .mac-dock {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            padding: 12px 18px;
            
            /* Glassmorphism for the Dock body */
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.1), 
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            z-index: 1000;
        }

        .dock-item {
            position: relative;
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 16px; 
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2); 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .dock-item svg {
            width: 26px;
            height: 26px;
            stroke: var(--text-main);
            stroke-width: 1.5;
            fill: none;
            transition: all 0.3s ease;
        }

        /* Hover Physics */
        .dock-item:hover {
            transform: translateY(-12px) scale(1.15);
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ffffff;
            box-shadow: 
                0 15px 25px rgba(0, 0, 0, 0.12), 
                inset 0 2px 5px rgba(255, 255, 255, 1);
        }

        /* Click Physics */
        .dock-item:active {
            transform: translateY(-5px) scale(1.05);
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        /* Light Reflection */
        .dock-item::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 20%;
            width: 60%;
            height: 6px;
            background: rgba(255, 255, 255, 0.9);
            filter: blur(5px);
            border-radius: 50%;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .dock-item:hover::after {
            opacity: 1;
            bottom: -20px;
        }

        /* Tooltips */
        .dock-item::before {
            content: attr(data-title);
            position: absolute;
            top: -45px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            white-space: nowrap;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            pointer-events: none;
        }

        .dock-item:hover::before {
            opacity: 1;
            visibility: visible;
            top: -55px; 
        }

        @media (max-width: 600px) {
            .container { padding: 50px 30px; }
            h1 { font-size: 2rem; }
            .mac-dock { gap: 10px; padding: 10px 15px; bottom: 15px; }
            .dock-item { width: 45px; height: 45px; border-radius: 12px; }
            .dock-item svg { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <span class="subtitle">Feature Provisioning</span>
    <h1>Deployment in Progress</h1>
    
    <p>This module is currently being built and deployed via Terraform.<br>Please check back shortly.</p>
    
    <p style="font-size: 0.95rem; color: var(--text-muted);">
        Automatically returning to the main architecture log in:<br>
        <span class="timer-text" id="countdownTimer">05:00</span>
    </p>

    <a href="index.html" class="glass-btn">&larr; Return Home Now</a>
</div>

<!-- APPLE STYLE GLASS DOCK (Navigates back to index) -->
<nav class="mac-dock">
    <a href="index.html" class="dock-item" data-title="Home">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
    </a>

    <a href="index.html#projects" class="dock-item" data-title="Releases">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="16" y1="18" x2="16" y2="22"></line>
            <line x1="8" y1="18" x2="8" y2="22"></line>
            <rect x="2" y="6" width="20" height="12" rx="2" ry="2"></rect>
            <circle cx="12" cy="12" r="2"></circle>
        </svg>
    </a>

    <a href="index.html#skills" class="dock-item" data-title="Stack">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
        </svg>
    </a>
</nav>

<script>
    // 5 Minute Countdown Timer Logic (300 seconds)
    let timeLeft = 300; 
    const timerElement = document.getElementById('countdownTimer');

    const countdown = setInterval(() => {
        timeLeft--;
        
        // Calculate minutes and seconds
        const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const seconds = (timeLeft % 60).toString().padStart(2, '0');
        
        // Update the display
        timerElement.textContent = `${minutes}:${seconds}`;
        
        // Redirect when time is up
        if (timeLeft <= 0) {
            clearInterval(countdown);
            window.location.href = 'index.html'; // Redirect to home
        }
    }, 1000); // Run every 1000ms (1 second)
</script>

</body>
</html>
